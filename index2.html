<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلل درجات الطلاب</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5fa;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 540px;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        h2 {
            text-align: right;
            margin-bottom: 30px;
            font-size: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 2px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            text-align: right;
        }

        input:focus {
            outline: none;
            border-color: #24549b;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #24549b;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #173c75;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            line-height: 2;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>محلل درجات الطالب</h2>

        <label>الدرجة الأولى:</label>
        <input type="number" id="grade1" placeholder="مثال: 85">

        <label>الدرجة الثانية:</label>
        <input type="number" id="grade2" placeholder="مثال: 90">

        <label>الدرجة الثالثة:</label>
        <input type="number" id="grade3" placeholder="مثال: 75">

        <label>نسبة الحضور (%):</label>
        <input type="number" id="attendance" placeholder="مثال: 80">

        <button onclick="analyzeResult()">تحليل النتيجة</button>

        <div id="result"></div>

    </div>

    <script>

        function analyzeResult() {

            let grade1 = Number(document.getElementById("grade1").value);
            let grade2 = Number(document.getElementById("grade2").value);
            let grade3 = Number(document.getElementById("grade3").value);
            let attendance = Number(document.getElementById("attendance").value);

            let result = document.getElementById("result");

            let inputs = [
                document.getElementById("grade1").value,
                document.getElementById("grade2").value,
                document.getElementById("grade3").value,
                document.getElementById("attendance").value
            ];

            if (inputs.some(value => value.trim() === "")) {
                result.style.display = "block";
                result.style.backgroundColor = "#ffe0e0";
                result.innerHTML = "من فضلك أدخل جميع البيانات";
                return;
            }

            if (
                grade1 < 0 || grade1 > 100 ||
                grade2 < 0 || grade2 > 100 ||
                grade3 < 0 || grade3 > 100 ||
                attendance < 0 || attendance > 100
            ) {
                result.style.display = "block";
                result.style.backgroundColor = "#ffe0e0";
                result.innerHTML = "الدرجات ونسبة الحضور يجب أن تكون بين 0 و100";
                return;
            }

            let average = (grade1 + grade2 + grade3) / 3;

            let evaluation;

            if (average >= 85) {
                evaluation = "ممتاز";
            }
            else if (average >= 75) {
                evaluation = "جيد جداً";
            }
            else if (average >= 65) {
                evaluation = "جيد";
            }
            else if (average >= 50) {
                evaluation = "مقبول";
            }
            else {
                evaluation = "راسب";
            }

            let status;

            if (average >= 50 && attendance >= 75) {
                status = "ناجح";
            }
            else {
                status = "غير مستوفٍ لشروط النجاح";
            }

            result.style.display = "block";
            result.style.backgroundColor = "#e5f3e8";

            result.innerHTML = `
                <h3>نتيجة تحليل الطالب</h3>
                متوسط الدرجات: ${average.toFixed(2)}%
                <br>
                التقدير: ${evaluation}
                <br>
                نسبة الحضور: ${attendance}%
                <br>
                الحالة: ${status}
            `;
        }

    </script>

</body>
</html>
